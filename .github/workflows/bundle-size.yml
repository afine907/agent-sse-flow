name: Bundle Size

on:
  pull_request:
    branches: [main]

jobs:
  bundle-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build

      - name: Measure bundle sizes
        id: sizes
        run: |
          # Collect file sizes
          es_size=$(stat -f%z dist/agent-sse-flow.es.js 2>/dev/null || stat -c%s dist/agent-sse-flow.es.js)
          cjs_size=$(stat -f%z dist/agent-sse-flow.cjs.js 2>/dev/null || stat -c%s dist/agent-sse-flow.cjs.js)
          css_size=$(stat -f%z dist/style.css 2>/dev/null || stat -c%s dist/style.css)
          dts_size=$(stat -f%z dist/index.d.ts 2>/dev/null || stat -c%s dist/index.d.ts)
          total=$((es_size + cjs_size + css_size))

          echo "es_size=$es_size" >> $GITHUB_OUTPUT
          echo "cjs_size=$cjs_size" >> $GITHUB_OUTPUT
          echo "css_size=$css_size" >> $GITHUB_OUTPUT
          echo "dts_size=$dts_size" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT

          # Human-readable sizes
          echo "es_kb=$(echo "scale=1; $es_size / 1024" | bc)" >> $GITHUB_OUTPUT
          echo "cjs_kb=$(echo "scale=1; $cjs_size / 1024" | bc)" >> $GITHUB_OUTPUT
          echo "css_kb=$(echo "scale=1; $css_size / 1024" | bc)" >> $GITHUB_OUTPUT
          echo "dts_kb=$(echo "scale=1; $dts_size / 1024" | bc)" >> $GITHUB_OUTPUT
          echo "total_kb=$(echo "scale=1; $total / 1024" | bc)" >> $GITHUB_OUTPUT

      - name: Check size budget
        run: |
          total=${{ steps.sizes.outputs.total }}
          budget=$((80 * 1024))  # 80 KB budget

          if [ "$total" -gt "$budget" ]; then
            echo "::warning::Bundle size (${{ steps.sizes.outputs.total_kb }} KB) exceeds budget (80 KB)"
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const esKb = '${{ steps.sizes.outputs.es_kb }}';
            const cjsKb = '${{ steps.sizes.outputs.cjs_kb }}';
            const cssKb = '${{ steps.sizes.outputs.css_kb }}';
            const dtsKb = '${{ steps.sizes.outputs.dts_kb }}';
            const totalKb = '${{ steps.sizes.outputs.total_kb }}';
            const total = parseInt('${{ steps.sizes.outputs.total }}');
            const budget = 80 * 1024;

            const overBudget = total > budget;
            const statusIcon = overBudget ? ':warning:' : ':white_check_mark:';

            const body = `## ${statusIcon} Bundle Size Report

            | File | Size |
            |------|------|
            | \`agent-sse-flow.es.js\` (ESM) | ${esKb} KB |
            | \`agent-sse-flow.cjs.js\` (CJS) | ${cjsKb} KB |
            | \`style.css\` | ${cssKb} KB |
            | \`index.d.ts\` (types) | ${dtsKb} KB |
            | **Total (ESM + CJS + CSS)** | **${totalKb} KB** |

            ${overBudget ? `> :warning: **Bundle exceeds 80 KB budget.** Consider optimizing dependencies or enabling tree-shaking.` : '> Bundle is within the 80 KB budget.'}
            `;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Bundle Size Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
